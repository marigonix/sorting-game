    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Sorting Game</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .creator-dashboard {
            background: #fffbe7;
            border: 2px dashed #8a6446;
            padding: 20px;
            border-radius: 6px;
            width: 90%;
            max-width: 800px;
            margin-bottom: 30px;
            font-family: 'Georgia', serif;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .creator-dashboard h2 { margin-top: 0; color: #3d2314; }
        .creator-dashboard p { text-align: left; margin-bottom: 10px; font-size: 0.95rem; }
        .creator-dashboard textarea {
            width: 100%; height: 140px; font-family: monospace;
            border: 1px solid #c8b9a6; padding: 10px; box-sizing: border-box;
            border-radius: 4px; background: #faf8f5; margin-bottom: 15px;
        }
        .dashboard-actions { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .link-output {
            flex-grow: 1; 
            padding: 10px 14px; 
            background: #fff;
            border: 1px solid #c8b9a6; 
            border-radius: 4px;
            font-size: 0.9rem; 
            color: #555;
            font-family: monospace;
            box-sizing: border-box;
            outline: none;
        }
        .btn-dash { background: #8a6446; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-dash:hover { background: #6e4d34; }

        .game-wrapper {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1>Sorting game</h1>
    
    <div class="creator-dashboard" id="creator-dashboard">
        <h2>Creator Dashboard</h2>
        <p>Type out shelves and books below using this clean layout format:</p>
        <textarea id="data-input">[SHELVES]
категорія: назва

[BOOKS]
Назва | категорія | #2a9d8f | https://example.com

</textarea>
        
        <div class="dashboard-actions">
            <button class="btn-dash" onclick="generateGameLink()">Build Shareable Link</button>
            <div style="display: flex; gap: 8px; flex-grow: 1; width: 100%; max-width: 530px;">
                <input type="text" class="link-output" id="link-output" readonly value="Your player link will appear here..." onclick="this.select()">
                <button class="btn-dash" id="copy-btn" onclick="copyGeneratedLink()" style="background-color: #5c3e26; white-space: nowrap;" disabled>Copy Link</button>
            </div>
        </div>
    </div>

    <div class="game-wrapper" id="game-wrapper">
        <div class="bookcase" id="bookcase"></div>
        <div class="book-pile" id="book-pile" ondragover="allowDrop(event)" ondrop="dropElement(event)"></div>
        
        <div class="controls">
            <button class="btn-check" onclick="checkAnswers()">Перевірити</button>
            <button class="btn-reset" onclick="resetGame()">Заново</button>
        </div>
    </div>

    <script>
        let gameConfig = { shelves: [], books: [] };

        const SUPABASE_URL = "https://qqspuhrasyuukxuyllgs.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxc3B1aHJhc3l1dWt4dXlsbGdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTI0OTUsImV4cCI6MjEwNzcyODQ5NX0.78Ef8o8yukQ1n990lEqC30qcIJEHIs9Fc1EAvFz0I6s";

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const gameId = urlParams.get('id'); 

            if (gameId) {
                document.getElementById('creator-dashboard').style.display = 'none';
                document.getElementById('game-wrapper').style.display = 'flex';
        
                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/games?id=eq.${gameId}`, {
                        headers: {
                            "apikey": SUPABASE_ANON_KEY,
                            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    });
                    const data = await response.json();
            
                    if (data && data.length > 0) {
                        const gameData = data[0].config_text;
                        document.getElementById('data-input').value = gameData;
                        parseCustomText(gameData);
                    } else {
                        throw new Error("Game not found");
                    }
                } catch(e) {
                    alert("Oops! Could not load this game configuration.");
                    showDashboard();
                }
            } else {
                showDashboard();
            }
        };

        function showDashboard() {
            document.getElementById('creator-dashboard').style.display = 'block';
            document.getElementById('game-wrapper').style.display = 'none';
        }

        async function generateGameLink() {
            const inputText = document.getElementById('data-input').value.trim();
            const outputField = document.getElementById('link-output');
            const copyButton = document.getElementById('copy-btn');
    
            if (!inputText) return alert("Please enter some game configuration data first!");
    
            outputField.value = "Saving game to cloud database...";
            copyButton.disabled = true;

            try {
                const uniqueId = Math.random().toString(36).substring(2, 10);
                const response = await fetch(`${SUPABASE_URL}/rest/v1/games`, {
                    method: 'POST',
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify({
                        id: uniqueId,
                        config_text: inputText
                    })
                });

                if (response.ok) {
                    const shareableUrl = `${window.location.origin}${window.location.pathname}?id=${uniqueId}`;
            
                    outputField.value = shareableUrl;
                    copyButton.disabled = false;
                    copyButton.style.backgroundColor = "#2a9d8f";
                    copyButton.innerText = "Copy Link";
            
                    navigator.clipboard.writeText(shareableUrl);
                    alert("Success! Game saved to cloud database and short link copied!");
                } else {
                    throw new Error("Database insertion rejected.");
                }
            } catch (error) {
                console.error(error);
                outputField.value = "Error saving to cloud.";
                alert("Could not connect to the cloud database storage.");
            }
    
            document.getElementById('game-wrapper').style.display = 'flex';
            parseCustomText(inputText);
        }

        function parseCustomText(text) {
            const lines = text.split('\n');
            let currentSection = "";
            let newShelves = [];
            let newBooks = [];
            let bookCount = 1;

            lines.forEach(line => {
                line = line.trim();
                if (!line || line.startsWith('//')) return;

                if (line.toUpperCase() === "[SHELVES]") { currentSection = "shelves"; return; }
                if (line.toUpperCase() === "[BOOKS]") { currentSection = "books"; return; }

                if (currentSection === "shelves") {
                    const parts = line.split(':');
                    if (parts.length >= 2) {
                        newShelves.push({ id: parts[0].trim(), title: parts[1].trim() });
                    }
                } else if (currentSection === "books") {
                    const parts = line.split('|');
                    if (parts.length >= 2) {
                        const imageUrl = parts[3] ? parts[3].trim() : "";
                        newBooks.push({
                            id: "b" + bookCount++,
                            text: parts[0].trim(),
                            shelf: parts[1].trim(),
                            color: parts[2] ? parts[2].trim() : "#5c341d",
                            image: imageUrl
                        });
                    }
                }
            });

            gameConfig.shelves = newShelves;
            gameConfig.books = newBooks;
            initGame();
        }

        function initGame() {
            document.querySelectorAll('.extension-shelf').forEach(el => el.remove());
            const bookcase = document.getElementById('bookcase');
            const bookPile = document.getElementById('book-pile');
            bookcase.innerHTML = ""; bookPile.innerHTML = "";
        
            gameConfig.shelves.forEach(shelfData => {
                const shelfContainer = document.createElement('div'); shelfContainer.className = 'shelf';
                const shelfInterior = document.createElement('div'); shelfInterior.className = 'shelf-interior';
                
                const plaqueDiv = document.createElement('div'); plaqueDiv.className = 'plaque';
                plaqueDiv.innerText = shelfData.title;
        
                const dropZone = document.createElement('div'); dropZone.className = 'drop-zone';
                dropZone.id = shelfData.id;
                dropZone.setAttribute('ondragover', 'allowDrop(event)');
                dropZone.setAttribute('ondrop', 'dropElement(event)');
        
                const endMarker = document.createElement('div');
                endMarker.className = 'shelf-end-marker';
                dropZone.appendChild(endMarker);
        
                shelfInterior.appendChild(plaqueDiv); 
                shelfInterior.appendChild(dropZone);
                
                const shelfWood = document.createElement('div'); shelfWood.className = 'shelf-wood';
        
                shelfContainer.appendChild(shelfInterior); shelfContainer.appendChild(shelfWood);
                bookcase.appendChild(shelfContainer);
            });
        
            const shuffledBooks = [...gameConfig.books].sort(() => Math.random() - 0.5);
            shuffledBooks.forEach(bookData => {
                const bookDiv = document.createElement('div'); bookDiv.className = 'book';
                bookDiv.id = bookData.id; 
                bookDiv.innerText = bookData.text; 
                bookDiv.setAttribute('draggable', 'true');
                bookDiv.setAttribute('data-correct-shelf', bookData.shelf);
                bookDiv.setAttribute('ondragstart', 'dragElement(event)');
                
                if (bookData.image) {
                    bookDiv.style.backgroundImage = "url('" + bookData.image + "')";
                } else {
                    bookDiv.style.backgroundColor = bookData.color;
                    bookDiv.style.color = "#fff1cc"; 
                    bookDiv.style.writingMode = "vertical-rl";
                    bookDiv.style.textTransform = "uppercase";
                }
                bookPile.appendChild(bookDiv);
            });
        }


        function allowDrop(ev) { ev.preventDefault(); }
        function dragElement(ev) { ev.dataTransfer.setData("text", ev.target.id); ev.target.classList.remove('correct', 'incorrect'); }

        function dropElement(ev) {
            ev.preventDefault(); 
            const data = ev.dataTransfer.getData("text"); 
            const draggedBook = document.getElementById(data);
            let targetZone = ev.target;
        
            if (!targetZone.classList.contains('drop-zone') && targetZone.id !== 'book-pile') {
                targetZone = targetZone.closest('.drop-zone') || document.getElementById('book-pile');
            }
        
            targetZone.appendChild(draggedBook); 
            draggedBook.classList.remove('correct', 'incorrect');
        
            if (targetZone.id !== 'book-pile') {
                const MAX_BOOKS_PER_ROW = 4; 
                const currentBookCount = targetZone.children.length;
                const parentShelf = targetZone.closest('.shelf');
        
                if (currentBookCount >= MAX_BOOKS_PER_ROW && !parentShelf.hasAttribute('data-has-extended')) {
                    parentShelf.setAttribute('data-has-extended', 'true');
                    const extensionShelf = document.createElement('div'); 
                    extensionShelf.className = 'shelf extension-shelf';
            
                    const shelfInterior = document.createElement('div'); 
                    shelfInterior.className = 'shelf-interior';
                    shelfInterior.style.boxShadow = "inset 0 -15px 20px rgba(0,0,0,0.6)";
            
                    const newDropZone = document.createElement('div'); 
                    newDropZone.className = 'drop-zone';
                    newDropZone.id = targetZone.id;
                    newDropZone.setAttribute('ondragover', 'allowDrop(event)');
                    newDropZone.setAttribute('ondrop', 'dropElement(event)');
                    newDropZone.style.paddingLeft = "20px"; 
            
                    shelfInterior.appendChild(newDropZone);
                    const shelfWood = document.createElement('div'); 
                    shelfWood.className = 'shelf-wood';
                    extensionShelf.appendChild(shelfInterior); 
                    extensionShelf.appendChild(shelfWood);
                    parentShelf.insertAdjacentElement('afterend', extensionShelf);
                }
            }
        }




        function checkAnswers() {
            document.querySelectorAll('.book').forEach(book => {
                const currentShelf = book.parentElement.id; 
                const correctShelf = book.getAttribute('data-correct-shelf');
                if (book.parentElement.id === 'book-pile') { 
                    book.classList.remove('correct', 'incorrect'); 
                    return; 
                }
        
                if (currentShelf === correctShelf) { 
                    book.classList.add('correct'); 
                    book.classList.remove('incorrect'); 
                } else { 
                    book.classList.add('incorrect'); 
                    book.classList.remove('correct'); 
                }
            });
        }

        function resetGame() { initGame(); }

        function copyGeneratedLink() {
            const outputField = document.getElementById('link-output');
            outputField.select();
            outputField.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(outputField.value);
    
            const copyButton = document.getElementById('copy-btn');
            copyButton.innerText = "✓ Copied!";
            copyButton.style.backgroundColor = "#38b000";
    
            setTimeout(() => {
                copyButton.innerText = "Copy Link";
                copyButton.style.backgroundColor = "#2a9d8f";
            }, 2000);
        }

    </script>
    <script src="server.js"></script> 
</body>
